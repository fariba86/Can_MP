        <h1>Concern Regarding Entry of IRGC-Affiliated Individuals into Canada</h1>
        <a href="mailto:Anita.Anand@parl.gc.ca?subject=Concern%20Regarding%20Entry%20of%20IRGC-Affiliated%20Individuals%20into%20Canada&body=Dear%20Mrs.%20Anand%2C%0A%0AI%20am%20writing%20to%20express%20my%20serious%20concern%20regarding%20the%20potential%20entry%20into%20Canada%20of%20individuals%20affiliated%20with%20the%20Islamic%20Revolutionary%20Guard%20Corps%20(IRGC)%2C%20as%20well%20as%20Mehdi%20Taj%2C%20head%20of%20the%20Islamic%20Republic%20of%20Iran%20Football%20Federation.%0A%0AThe%20IRGC%20has%20been%20officially%20designated%20as%20a%20terrorist%20organization%20in%20Canada.%20In%20light%20of%20this%20designation%2C%20allowing%20individuals%20connected%20to%20or%20affiliated%20with%20the%20IRGC%20to%20enter%20Canada%20would%20be%20inconsistent%20with%20Canadian%20law%2C%20as%20well%20as%20with%20Canada%E2%80%99s%20commitment%20to%20human%20rights%20and%20public%20safety.%0A%0AIt%20is%20also%20deeply%20concerning%20that%20Mehdi%20Taj%20has%20reportedly%20held%20a%20position%20as%20the%20commander%20of%20intelligence%20for%20the%20IRGC%20in%20Isfahan.%20This%20background%20raises%20serious%20questions%20regarding%20his%20eligibility%20to%20enter%20Canada%20under%20existing%20laws%20and%20regulations.%0A%0ASuch%20a%20decision%20would%20send%20a%20troubling%20message%20to%20Canadians%2C%20especially%20to%20the%20Iranian-Canadian%20community%2C%20and%20risks%20undermining%20trust%20in%20the%20enforcement%20of%20Canada%E2%80%99s%20own%20laws.%0A%0AI%20respectfully%20urge%20your%20office%20to%20take%20immediate%20and%20decisive%20action%20to%20deny%20entry%20to%20these%20individuals%20and%20to%20ensure%20that%20all%20relevant%20laws%20and%20policies%20are%20strictly%20upheld.%0A%0AThank%20you%20for%20your%20attention%20to%20this%20urgent%20matter.%0A%0ASincerely%2C%0A%5BYour%20Name%5D"><button>Foreign Minister</button></a>
